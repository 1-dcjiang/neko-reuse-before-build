[plugin]
id = "reuse_before_build"
name = "先搜后建"
description = "让 AI 在写任何新程序、脚本、库、插件或服务之前，先检索已有的公开实现（尤其 GitHub 仓库），优先加入上游成为贡献者，而不是从零重造。插件把规则本体、检索工具、交付物机械检查与本地化校验一起装进 N.E.K.O：规则段带 sha256 基线，删条/改号/丢门禁会被校验器当场报错。"
short_description = "写新程序前先检索同类公开实现，按可改性与许可评估并优先贡献上游；带规则校验和只读 GitHub 检索。"
keywords = ["先搜后建", "复用优先", "别重复造轮子", "重复造轮子", "有没有现成的", "有没有开源", "从零实现", "帮我写一个工具", "造轮子", "检索同类项目", "GitHub 搜索", "贡献上游", "向上游提 PR", "不可复用原因", "reuse before build", "reinvent the wheel", "existing implementation", "open source alternative", "from scratch", "not reusable because"]
version = "0.3.9"
type = "plugin"
entry = "plugin.plugins.reuse_before_build:ReuseBeforeBuildPlugin"

[plugin.author]
name = "1-dcjiang"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true
timeout = 10

[plugin.store]
enabled = false

[plugin.ui]
enabled = true

[[plugin.ui.guide]]
id = "quickstart"
title = "使用说明"
entry = "docs/guide.md"
permissions = ["state:read"]

[settings]
# 是否允许调用本机 gh CLI 做 GitHub 检索（只读搜索，不做任何写操作）
enable_github_scan = true
# gh 可执行文件名；只允许 gh / gh.exe，不支持自定义路径
gh_binary = "gh"
# 默认星数门槛与返回条数
default_stars = 50
default_limit = 6
# 默认时间窗（天）：只看最近 N 天内有推送的仓库
updated_days = 365
# 整次检索总预算（秒）：登录检查 + 所有关键词共享这一份，不是每个关键词各给一份
scan_timeout = 30

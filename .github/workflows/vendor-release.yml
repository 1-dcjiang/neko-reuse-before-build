name: Vendor Source Release

on:
  workflow_run:
    workflows: ["Release N.E.K.O Plugin"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: vendor-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  vendor:
    name: Package verified vendor source
    # 只处理标签推送触发且已经完整成功的官方 Release，忽略手动 main 运行和失败运行。
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Check out the exact released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, verify, checksum and upload vendor assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="dist/neko-reuse-before-build-${RELEASE_TAG}-vendor.zip"
          python scripts/vendor_release.py build --tag "$RELEASE_TAG" --output-dir dist
          python scripts/vendor_release.py verify-archive "$archive"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist \
            --pattern 'reuse_before_build.neko-plugin' \
            --pattern 'reuse_before_build.market-release-check.txt' \
            --pattern 'market-evidence.json'
          cp scripts/vendor_release.py dist/vendor_release.py
          python scripts/vendor_release.py sums dist --output dist/SHA256SUMS.txt
          python scripts/vendor_release.py verify-archive "$archive" --sums dist/SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" \
            "$archive" dist/SHA256SUMS.txt dist/vendor_release.py \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

name: Offline regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install pytest ruff
      - name: Run host and bundled-skill tests
        run: python -m pytest -q tests skills/reuse-before-build/tests
      - name: Run Ruff
        run: python -m ruff check .

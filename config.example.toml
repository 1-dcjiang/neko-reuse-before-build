# 可复制的运行配置示例（N.E.K.O 插件模板约定：可变默认值放这里，不放 plugin.toml）
# 用户配置以本文件为模板；插件代码读到的键名与这里一致。
# 注意：本文件不能包含 [plugin] 表——清单信息只属于 plugin.toml。

[plugin_runtime]
enabled = true
# 本插件无定时器，但 llm_tool 需要在运行中才暴露给 AI，所以随宿主启动
auto_start = true
timeout = 10

[settings]
# 是否允许调用本机 gh CLI 做 GitHub 检索（只读搜索，不做任何写操作）
enable_github_scan = true
# gh 可执行文件名或绝对路径；留空则用 PATH 里的 gh
gh_binary = "gh"
# 默认星数门槛与返回条数
default_stars = 50
default_limit = 6
# 默认时间窗（天）：只看最近 N 天内有推送的仓库
updated_days = 365
# 单次 gh 调用超时（秒）
scan_timeout = 30
